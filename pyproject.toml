[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reply-flow-agent"
version = "0.3.0"
description = "Embedded ReplyFlow workbench demo for simulated marketplace messages."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "mcp>=1.0,<2",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
  "reportlab>=4.0,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
]

[tool.setuptools.packages.find]
where = ["src"]
